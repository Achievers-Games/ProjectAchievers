version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=file:./dev.db
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - STEAM_CLIENT_ID=${STEAM_CLIENT_ID}
      - STEAM_CLIENT_SECRET=${STEAM_CLIENT_SECRET}
      - STEAM_REDIRECT_URI=http://localhost:3001/api/steam/oauth/callback
      - STEAM_OPENID_REALM=http://localhost:3001
      - STEAM_OPENID_RETURN_TO=http://localhost:3001/api/steam/oauth/callback
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=http://localhost:3001/api/discord/oauth/callback
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/prisma:/app/prisma
    working_dir: /app
    command: npm run dev
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001/api
      - PUBLIC_STEAM_OPENID_REALM=http://localhost:3001
      - PUBLIC_STEAM_OPENID_RETURN_TO=http://localhost:3001/api/steam/oauth/callback
      - PUBLIC_DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev
    depends_on:
      - backend

  # Optional: Redis for production PKCE storage, sessions, caching
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

