<!doctype html>
<html lang="%lang%" data-theme="%theme%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="%sveltekit.assets%/brand/icon-32.png" type="image/png" sizes="32x32" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg?v=achievers-1"
      type="image/svg+xml"
      sizes="any"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/brand/apple-touch-icon.png"
      sizes="180x180"
    />
    %sveltekit.head%
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
