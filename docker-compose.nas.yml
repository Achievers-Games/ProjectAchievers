# Hébergement sur un NAS à 2 Go de mémoire, sans port ouvert sur Internet.
# Démarrer : docker compose -f docker-compose.nas.yml --profile tunnel up -d
# Sans limite, le journal Docker d'un service grossit jusqu'à remplir le disque du NAS.
# Trois fichiers de 10 Mo par service gardent trois semaines de journal au plus fort.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 384m
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_USER: achievers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      POSTGRES_DB: achievers
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U achievers']
      interval: 10s
      retries: 10

  site:
    image: ${SITE_IMAGE:-ghcr.io/achievers-games/projectachievers:latest}
    build: .
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    # Résolution directe : celle du NAS a déjà échoué par moments.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      db:
        condition: service_healthy
    # Accessible seulement depuis le NAS : le public passe par le tunnel.
    ports:
      - '127.0.0.1:3100:3000'
    # En lecture seule : le site vérifie seulement que la sauvegarde du jour existe.
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
    environment:
      DATABASE_URL: postgresql://achievers:${POSTGRES_PASSWORD}@db:5432/achievers
      ORIGIN: ${ORIGIN:?URL publique du site}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?32 octets en hexadécimal}
      # Pendant un changement de clé seulement : l'ancienne, le temps que tout soit rechiffré.
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      BACKUP_DIR: /backups
      ADDRESS_HEADER: CF-Connecting-IP
      NODE_OPTIONS: --max-old-space-size=320
      # Chaque import rend son créneau tous les vingt jeux : personne n'attend derrière une
      # grosse bibliothèque. BACKGROUND_CONCURRENCY borne leur nombre de front.
      SYNC_CONCURRENCY: '1'
      SYNC_GAME_CONCURRENCY: '1'
      # Les lectures de jeux Steam sont légères : quatre de front divisent le premier import.
      STEAM_CONCURRENCY: '4'
      # Deux traitements de fond de front : avec un seul, les plateformes d'un même bouton
      # passaient l'une après l'autre (mesuré : une à trois minutes par clic). Le bouton Steam
      # ne relit plus toute la bibliothèque, et le site tient sous 200 Mo sur ses 512.
      BACKGROUND_CONCURRENCY: '2'
      BLIZZARD_DETAILS_PER_RUN: '50'
      # `docker compose logs site` reste lisible : debug pour les enquêtes, info par défaut.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      BLIZZARD_CLIENT_ID: ${BLIZZARD_CLIENT_ID:-}
      BLIZZARD_CLIENT_SECRET: ${BLIZZARD_CLIENT_SECRET:-}
      EPIC_CLIENT_ID: ${EPIC_CLIENT_ID:-}
      EPIC_CLIENT_SECRET: ${EPIC_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      RETRO_API_KEY: ${RETRO_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT: ${VAPID_CONTACT:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      XBOX_CLIENT_ID: ${XBOX_CLIENT_ID:-}
      XBOX_CLIENT_SECRET: ${XBOX_CLIENT_SECRET:-}
      PSN_SERVICE_NPSSO: ${PSN_SERVICE_NPSSO:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AI_TOKEN: ${CLOUDFLARE_AI_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      # Liaison automatique des comptes avec Lure : vides, aucun appel ne part (scripts/nas-lure.sh).
      LURE_API_URL: ${LURE_API_URL:-}
      LURE_API_KEY: ${LURE_API_KEY:-}
      CONTACT_INBOX: ${CONTACT_INBOX:-}

  # Met le site à jour tout seul dès que la CI publie une image de `main` : c'est le NAS qui tire,
  # donc la CI n'a pas besoin de joindre le réseau local. Le code voyage dans l'image ; un
  # changement de ce fichier ou du `.env` passe encore par scripts/deploy-nas.sh.
  deployer:
    image: docker:cli
    restart: unless-stopped
    mem_limit: 96m
    logging: *logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    environment:
      DOCKER_CONFIG: /app/.docker
      # Sans ces deux variables, Compose prendrait docker-compose.yml et créerait un second
      # projet (« app ») avec sa propre base.
      COMPOSE_FILE: /app/docker-compose.nas.yml
      COMPOSE_PROJECT_NAME: project-achievers
    working_dir: /app
    # Résolution directe, comme pour le site : celle du NAS échoue par moments.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        image=ghcr.io/achievers-games/projectachievers:latest
        state=/app/.deployed-image
        # Premier passage : on note l'image déjà en place, sans redémarrer le site pour rien.
        if [ ! -s "$$state" ]; then
          docker compose pull -q site >/dev/null || true
          docker image inspect -f '{{index .RepoDigests 0}}' "$$image" > "$$state" 2>/dev/null || true
        fi
        while true; do
          before=$$(cat "$$state" 2>/dev/null)
          docker compose pull -q site >/dev/null || echo "Registre injoignable, nouvel essai dans 3 minutes."
          after=$$(docker image inspect -f '{{index .RepoDigests 0}}' "$$image" 2>/dev/null)
          if [ -n "$$after" ] && [ "$$after" != "$$before" ]; then
            echo "Nouvelle image : $$after"
            if ! docker compose up -d --no-build --wait --wait-timeout 240 site; then
              echo "ÉCHEC du démarrage de $$after" >&2
              sleep 180
              continue
            fi
            version=$$(docker compose exec -T site printenv APP_VERSION)
            if [ -z "$$version" ] || ! docker compose exec -T site node --input-type=module - https://achievers.games "$$version" 90 < /app/scripts/smoke.mjs; then
              echo "ÉCHEC du contrôle de production pour $$after" >&2
              sleep 180
              continue
            fi
            echo "$$after" > "$$state"
            # Une seule version suffit : sans cela, chaque déploiement laisse derrière lui son image.
            # « rmi » sans -f refuse justement l'image que fait tourner un conteneur.
            repo=$${image%:latest}
            docker images "$$repo" --format '{{.ID}} {{.Tag}}' | grep -v latest |
              cut -d' ' -f1 | sort -u |
              while read id; do docker rmi "$$id" >/dev/null 2>&1 || true; done
            docker image prune -f >/dev/null 2>&1 || true
          fi
          sleep 180
        done

  # Une sauvegarde par jour, 14 jours conservés.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          # Une sauvegarde ratée se voit dans `docker compose logs backup`, ne laisse pas de fichier
          # tronqué, et n'efface aucune ancienne : les 14 jours ne se vident pas pendant une panne.
          if pg_dump -h db -U achievers -Fc achievers > /backups/achievers-$$(date +%F).dump.tmp; then
            mv /backups/achievers-$$(date +%F).dump.tmp /backups/achievers-$$(date +%F).dump
            find /backups -name 'achievers-*.dump' -mtime +14 -delete
            echo "Sauvegarde du $$(date +%F) écrite."
          else
            rm -f /backups/achievers-$$(date +%F).dump.tmp
            echo "ÉCHEC de la sauvegarde du $$(date +%F) : les précédentes sont conservées." >&2
          fi
          sleep 86400
        done

  tunnel:
    # Version épinglée : avec `latest`, une mise à jour cassée arriverait sans prévenir. À relever à la main.
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    restart: unless-stopped
    mem_limit: 96m
    logging: *logging
    depends_on:
      - site
    # HTTP/2 (TCP) plutôt que QUIC (UDP) : derrière la box, les connexions QUIC décrochaient
    # (« no recent network activity ») et les pages traînaient plus de 30 s.
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  pgdata:
